sources:
  sales:
    type: csv
    mode: full
    path: data/sales.csv # This path assumes the data directory is relative to where the pipeline script runs

output_target:
  type: local_file
  auth_type: none
  path: data/output/gold_sales.parquet # Output path for the gold layer

data_profiles:
  sales:
    columns:
      - name: order_id
        type: int
      - name: customer_id
        type: int
      - name: customer_name
        type: str
        pii: true
      - name: customer_email
        type: str
        pii: true
      - name: product_id
        type: int
      - name: product_name
        type: str
        pii: true
      - name: quantity
        type: int
      - name: unit_price
        type: float
      - name: total_amount
        type: float
      - name: order_date
        type: datetime
      - name: region
        type: str
      - name: status
        type: str
    primary_keys: [order_id]
    pii_columns: [customer_name, customer_email, product_name]
    date_columns: [order_date]

pipeline_name: sales_pipeline
schedule: daily
staging_area: data/staging # Directory for bronze and silver parquet files
