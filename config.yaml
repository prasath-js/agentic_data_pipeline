# config.yaml
# Pipeline configuration file for sales_pipeline

pipeline_name: "sales_pipeline"
schedule: "daily"

bronze_layer:
  staging_path: "data/bronze"

silver_layer:
  staging_path: "data/silver"

gold_layer:
  output_path: "data/gold"
  output_target:
    type: "local_file"
    auth_type: "none" # No authentication needed for local file output

sources:
  - name: "sales"
    type: "csv"
    mode: "full"
    path: "data/raw/sales.csv" # Path to the raw CSV file
    schema:
      order_id: "int64"
      customer_id: "int64"
      customer_name: "object"
      customer_email: "object"
      product_id: "int64"
      product_name: "object"
      quantity: "int64"
      unit_price: "float64"
      total_amount: "float64"
      order_date: "datetime64[ns]"
      region: "object"
      status: "object"
    pii_columns:
      - "customer_name"
      - "customer_email"
      - "product_name"
    date_columns:
      - "order_date"

